<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Painel de Pedidos | Real Burger</title>
<link rel="icon" type="image/png" href="logo.png">
<meta name="theme-color" content="#0A1F4E"><script>if(location.hostname==="realburgerms.github.io")location.replace("https://realburgerms.com.br"+location.pathname+location.search+location.hash);</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#061433; --col:#0a1f4e; --card:#10306e; --line:#1d4185; --txt:#fff; --muted:#a9c3e8;
    --azul:#1a67bf; --corda:#3674c2; --claro:#dcebfb;
    --mesa:#3b8cf0; --entrega:#f59e0b; --retirada:#22c55e; --alerta:#ef4444;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Poppins,system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
  button{font-family:inherit;cursor:pointer;border:none}

  /* Login */
  #login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
  #login img{width:170px}
  #login h1{font-family:'Alfa Slab One',serif;font-weight:400;font-size:24px}
  #login input{font-size:22px;text-align:center;letter-spacing:6px;width:200px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:#fff}
  #login button{background:var(--azul);color:#fff;font-size:17px;font-weight:600;padding:14px 30px;border-radius:12px}
  #loginErro{color:#ff9a9a;font-size:14px;min-height:20px}

  /* Topo */
  header{display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--col);border-bottom:3px solid var(--corda);flex-wrap:wrap}
  header img{width:48px}
  header h1{font-family:'Alfa Slab One',serif;font-weight:400;font-size:20px;flex:1;min-width:150px}
  .filtros{display:flex;gap:6px;flex-wrap:wrap}
  .filtros button{background:var(--card);color:#fff;padding:7px 14px;border-radius:20px;font-size:13px;font-weight:600;border:1px solid var(--line)}
  .filtros button.sel{background:var(--azul);border-color:var(--azul)}
  .topo-dir{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
  #som{background:var(--card);color:#fff;border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:13px}
  #conexao{width:10px;height:10px;border-radius:50%;background:var(--retirada);display:inline-block}
  #conexao.off{background:var(--alerta)}
  #relogio{font-weight:600;color:#fff;font-size:15px}

  /* Colunas */
  main{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:12px;align-items:start}
  @media(max-width:820px){main{grid-template-columns:1fr}}
  .coluna{background:var(--col);border-radius:14px;padding:10px;min-height:200px}
  .coluna h2{font-size:15px;font-weight:700;display:flex;justify-content:space-between;align-items:center;padding:4px 6px 10px;text-transform:uppercase;letter-spacing:.5px}
  .coluna h2 span{background:var(--card);border-radius:20px;padding:2px 10px;font-size:13px}
  .vazio{color:var(--muted);font-size:13px;text-align:center;padding:24px 8px}

  /* Cartão */
  .card{background:var(--card);border-radius:12px;padding:12px;margin-bottom:10px;border-left:6px solid var(--mesa)}
  .card.entrega{border-left-color:var(--entrega)} .card.retirada{border-left-color:var(--retirada)}
  .card.novo-pisca{animation:pisca 1s ease-in-out 6}
  @keyframes pisca{50%{box-shadow:0 0 0 4px var(--claro)}}
  .c-topo{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .codigo{font-size:22px;font-weight:700}
  .tipo{font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px;background:var(--mesa);color:#061433;text-transform:uppercase}
  .entrega .tipo{background:var(--entrega)} .retirada .tipo{background:var(--retirada)}
  .tempo{font-size:13px;color:var(--muted);margin-top:2px}
  .tempo.atencao{color:var(--entrega);font-weight:600} .tempo.atrasado{color:var(--alerta);font-weight:700}
  .cliente{font-size:14px;margin-top:6px;font-weight:600}
  .end{font-size:13px;color:var(--claro);margin-top:2px}
  ul.itens{list-style:none;margin:8px 0;border-top:1px solid var(--line);padding-top:8px}
  ul.itens li{font-size:15px;margin-bottom:5px}
  ul.itens li b{font-size:16px}
  .det{display:block;font-size:13px;color:var(--claro);padding-left:14px}
  .obs{display:block;font-size:13px;color:#ffd27a;padding-left:14px;font-weight:600}
  .rodape{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px}
  .acoes{display:flex;gap:6px;margin-top:10px}
  .acoes .avancar{flex:1;background:var(--azul);color:#fff;font-weight:700;font-size:15px;padding:12px;border-radius:10px}
  .acoes .voltar,.acoes .cancelar{background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:10px;padding:0 12px;font-size:13px}

  /* Entregues */
  details{margin:0 12px 20px;background:var(--col);border-radius:14px;padding:12px 16px}
  summary{cursor:pointer;font-weight:600;color:var(--muted)}
  .linha-ent{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .linha-ent button{background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-size:12px}

  /* Contas das mesas */
  .vista{display:flex;gap:6px}
  .vista button{background:var(--card);color:#fff;padding:7px 14px;border-radius:20px;font-size:13px;font-weight:700;border:1px solid var(--line)}
  .vista button.sel{background:#ffd27a;color:#061433;border-color:#ffd27a}
  #vContas{padding:12px;display:none}
  .contas-topo{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  .contas-topo h2{font-family:'Alfa Slab One',serif;font-weight:400;font-size:20px}
  .btn-lancar{background:var(--azul);color:#fff;font-weight:700;font-size:14px;padding:10px 16px;border-radius:10px}
  .grade-contas{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;align-items:start}
  .conta{background:var(--col);border-radius:14px;padding:14px;border-top:5px solid var(--mesa)}
  .conta-topo{display:flex;justify-content:space-between;align-items:baseline}
  .conta-topo b{font-family:'Alfa Slab One',serif;font-weight:400;font-size:24px}
  .conta-topo span{font-size:13px;color:var(--muted)}
  .conta-ped{border-top:1px solid var(--line);padding:8px 0;font-size:14px}
  .conta-ped .cab{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-bottom:3px}
  .conta-ped .st{font-weight:700;text-transform:uppercase;font-size:11px}
  .conta-total{display:flex;justify-content:space-between;align-items:center;border-top:2px solid var(--corda);padding-top:10px;margin-top:4px;font-size:15px}
  .conta-total b{font-size:24px}
  .conta-acoes{display:flex;gap:8px;margin-top:12px}
  .conta-acoes button{flex:1;padding:12px;border-radius:10px;font-weight:700;font-size:14px}
  .b-add{background:var(--card);color:#fff;border:1px solid var(--line)!important}
  .b-fechar{background:var(--retirada);color:#061433}
  .linha-conta{display:flex;justify-content:space-between;font-size:13px;padding:8px 0;border-bottom:1px solid var(--line);gap:10px}

  /* Lançar itens */
  .fundo{position:fixed;inset:0;background:rgba(3,10,28,.75);display:none;align-items:flex-end;justify-content:center;z-index:50}
  .fundo.aberto{display:flex}
  .modal{background:var(--col);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}
  @media(min-width:700px){.fundo{align-items:center}.modal{border-radius:18px}}
  .modal h3{font-family:'Alfa Slab One',serif;font-weight:400;font-size:20px;display:flex;justify-content:space-between;align-items:center}
  .modal h3 button{background:none;color:var(--muted);font-size:22px}
  .sel-mesa{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
  .sel-mesa button{background:var(--card);color:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-weight:700}
  .sel-mesa button.sel{background:var(--mesa);color:#061433;border-color:var(--mesa)}
  .cat-t{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:14px 0 4px}
  .prod{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
  .prod small{color:var(--muted)}
  .prod button{background:var(--azul);color:#fff;border-radius:8px;width:38px;height:34px;font-size:20px;font-weight:700;flex-shrink:0}
  .opc{background:var(--card);border-radius:10px;padding:10px;margin:6px 0 10px;font-size:13px}
  .opc label{display:inline-flex;align-items:center;gap:5px;margin:3px 10px 3px 0}
  .opc input[type=text]{width:100%;margin-top:6px;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--col);color:#fff;font-family:inherit}
  .opc .ok{background:var(--azul);color:#fff;border-radius:8px;padding:8px 14px;font-weight:700;margin-top:8px}
  .lanc{position:sticky;bottom:-16px;background:var(--col);border-top:2px solid var(--corda);margin:10px -16px -16px;padding:12px 16px}
  .lanc-it{display:flex;justify-content:space-between;font-size:14px;padding:3px 0}
  .lanc-it button{background:none;color:#ff9a9a;font-size:13px}
  .b-enviar{width:100%;background:var(--retirada);color:#061433;font-weight:700;font-size:16px;padding:13px;border-radius:10px;margin-top:8px}
  .b-enviar:disabled{opacity:.5}
  .b-taxa{width:100%;margin-top:8px;background:transparent;border:1.5px dashed #ffd27a!important;color:#ffd27a;font-weight:700;font-size:14px;padding:9px;border-radius:10px}
  .taxa-ok{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px;font-size:12.5px;color:var(--claro)}
  .taxa-ok button{background:none;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:2px 8px;font-size:12px}
  .viagem{display:inline-block;margin-top:6px;background:#ffd27a;color:#061433;font-weight:800;font-size:13px;letter-spacing:.5px;padding:4px 10px;border-radius:8px}
  .viagem-p{color:#ffd27a;font-weight:700}
  #lancNomeBox{display:none;margin:4px 0 8px}
  #lancNomeBox input{width:100%;padding:9px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:#fff;font-family:inherit;font-size:14px}
  #aviso-config{background:var(--entrega);color:#061433;padding:10px 16px;font-weight:600;font-size:14px;display:none}
</style>
</head>
<body>

<div id="login">
  <img src="logo.png" alt="Real Burger">
  <h1>Painel de Pedidos</h1>
  <input id="pin" type="password" inputmode="numeric" placeholder="PIN" autocomplete="off">
  <button onclick="entrar()">Abrir painel</button>
  <p id="loginErro"></p>
</div>

<div id="app" style="display:none">
  <div id="aviso-config">Painel ainda não conectado à planilha. Preencha SCRIPT_URL no código.</div>
  <header>
    <img src="logo.png" alt="">
    <h1>Fila de pedidos</h1>
    <div class="filtros" id="filtros">
      <button data-f="todos" class="sel">Todos</button>
      <button data-f="mesa">Mesas</button>
      <button data-f="entrega">Entrega</button>
      <button data-f="retirada">Retirada</button>
    </div>
    <div class="vista"><button onclick="abrirLancar('balcao')">+ Balcão</button><button id="vbFila" class="sel" onclick="vista('fila')">Fila</button><button id="vbContas" onclick="vista('contas')">Contas abertas (0)</button></div>
    <div class="topo-dir">
      <span id="conexao" title="Conexão"></span>
      <button id="som" onclick="alternaSom()">🔔 Som ligado</button>
      <span id="relogio"></span>
    </div>
  </header>
  <section id="vContas">
    <div class="contas-topo"><h2>Contas das mesas</h2><button class="btn-lancar" onclick="abrirLancar(null)">+ Lançar pedido (mesa ou balcão)</button></div>
    <div class="grade-contas" id="gradeContas"></div>
    <details style="margin:16px 0 0"><summary id="sum-fechadas">Contas fechadas (0)</summary><div id="listaFechadas"></div></details>
  </section>
  <main id="vFila">
    <section class="coluna"><h2>Novos <span id="n-novo">0</span></h2><div id="col-novo"></div></section>
    <section class="coluna"><h2>Preparando <span id="n-preparando">0</span></h2><div id="col-preparando"></div></section>
    <section class="coluna"><h2>Prontos <span id="n-pronto">0</span></h2><div id="col-pronto"></div></section>
  </main>
  <details id="detEntregue"><summary id="sum-entregue">Entregues (0)</summary><div id="col-entregue"></div></details>
</div>

<div class="fundo" id="mLancar" onclick="if(event.target===this)fecharLancar()">
  <div class="modal">
    <h3><span id="lancTitulo">Lançar na mesa</span><button onclick="fecharLancar()">✕</button></h3>
    <div class="sel-mesa" id="lancMesas"></div>
    <div id="lancNomeBox"><input id="lancNome" type="text" placeholder="Nome do cliente (opcional)" maxlength="60"></div>
    <div id="lancCardapio"><p class="vazio">Carregando cardápio...</p></div>
    <div class="lanc"><div id="lancLista"></div>
      <div style="display:flex;justify-content:space-between;font-weight:700;margin-top:4px"><span>Total</span><span id="lancTotal">R$ 0,00</span></div>
      <button class="b-enviar" id="lancEnviar" onclick="enviarLancamento()">Enviar para a cozinha</button></div>
  </div>
</div>

<script>
/* ========= CONFIGURAÇÃO ========= */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbynEIDwnkohmAJuKFgftfutvmrZcnlN6JlwaEYd9yvqBr_VPwtmqsKgUUtIhMttBgc/exec";      // cole aqui a URL do App da Web do Google Apps Script
const ATUALIZAR_A_CADA = 5; // segundos
/* ================================ */

const $ = id => document.getElementById(id);
const brl = v => Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let pendentes = new Map(); function aplicaPendentes(lista){ const agora = Date.now(); lista.forEach(p=>{ const x = pendentes.get(p.id); if(!x) return; if(p.status===x.status || agora>x.ate){ pendentes.delete(p.id); } else { p.status = x.status; p.atualizado = x.quando; } }); } let PIN = "", pedidos = [], vistos = null, filtro = "todos", somLigado = true, audio = null, novosPiscando = new Set();

function guardar(k,v){ try{ localStorage.setItem(k,v) }catch(e){} }
function ler(k){ try{ return localStorage.getItem(k) }catch(e){ return null } }

async function api(params){
  const url = SCRIPT_URL + "?" + new URLSearchParams({...params, pin:PIN}).toString();
  const r = await fetch(url, {cache:"no-store"});
  return r.json();
}

async function entrar(){
  PIN = $("pin").value.trim();
  if(!PIN){ $("loginErro").textContent = "Digite o PIN."; return; }
  audio = audio || new (window.AudioContext||window.webkitAudioContext)();   // som liberado pelo clique
  if(!SCRIPT_URL){ abrirApp(); $("aviso-config").style.display="block"; return; }
  try{
    const r = await api({acao:"listar"});
    if(!r.ok){ $("loginErro").textContent = r.erro==="pin" ? "PIN incorreto." : "Erro: "+r.erro; return; }
    guardar("rb_pin", PIN); abrirApp(); receber(r);
  }catch(e){ $("loginErro").textContent = "Sem conexão com a planilha."; }
}
function abrirApp(){
  $("login").style.display="none"; $("app").style.display="block";
  if(ler("rb_som")==="0"){ somLigado=false; atualizaBotaoSom(); }
  setInterval(buscar, ATUALIZAR_A_CADA*1000);
  setInterval(()=>{ relogio(); desenhar(); }, 30000); relogio();
}

async function buscar(){
  if(!SCRIPT_URL) return;
  try{ const r = await api({acao:"listar"}); if(r.ok){ receber(r); $("conexao").classList.remove("off"); } }
  catch(e){ $("conexao").classList.add("off"); }
}

function receber(r){
  const ids = new Set(r.pedidos.map(p=>p.id));
  if(vistos){
    const novos = r.pedidos.filter(p=>!vistos.has(p.id) && p.status==="novo");
    if(novos.length){ bipe(); novos.forEach(p=>novosPiscando.add(p.id)); piscaTitulo(novos.length); }
  }
  vistos = ids; aplicaPendentes(r.pedidos); aplicaTaxas(r.pedidos); pedidos = r.pedidos; desenhar();
}

function minutos(p){ return Math.floor((Date.now()-p.criado)/60000); }
function hora(t){ return new Date(t).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}); }
function ehViagem(p){ return /PARA VIAGEM/i.test(p.endereco||""); }
function rotuloTipo(p){ return p.tipo==="mesa" ? `Mesa ${p.mesa}` : p.tipo==="entrega" ? "Entrega" : ehViagem(p) ? "Balcão" : "Retirada"; }

const PROXIMO = {novo:"preparando", preparando:"pronto", pronto:"entregue"};
const ANTERIOR = {preparando:"novo", pronto:"preparando"};
const TEXTO_BOTAO = {novo:"Começar preparo", preparando:"Marcar pronto", pronto:"Entregue"};

function cartao(p){
  const m = minutos(p), cls = m>=25 ? "atrasado" : m>=15 ? "atencao" : "";
  const itens = (p.itens||[]).map(i=>`<li><b>${i.qtd}x</b> ${esc(i.nome)}
      ${i.adicionais&&i.adicionais.length?`<span class="det">+ ${esc(i.adicionais.join(", "))}</span>`:""}
      ${i.obs?`<span class="obs">Obs.: ${esc(i.obs)}</span>`:""}</li>`).join("");
  const pisca = novosPiscando.has(p.id) ? " novo-pisca" : "";
  return `<div class="card ${p.tipo}${pisca}">
    <div class="c-topo"><span class="codigo">#${esc(p.id)}</span><span class="tipo">${rotuloTipo(p)}</span></div>
    <div class="tempo ${cls}">${hora(p.criado)} · há ${m} min</div>
    ${ehViagem(p)?`<div class="viagem">PARA VIAGEM · EMBALAR</div>`:""}
    <div class="cliente">${esc(p.cliente)}</div>
    ${p.tipo==="entrega"?`<div class="end">📍 ${esc(p.endereco)}</div>`:""}
    <ul class="itens">${itens}</ul>
    <div class="rodape"><span${/troco para/i.test(p.pagamento)?' style="color:#ffd27a;font-weight:700"':""}>${esc(p.pagamento)}</span><b style="color:#fff">${brl(p.total)}${p.tipo==="entrega"&&p.taxa==null?` <small style="color:#ffd27a;font-weight:600">+ entrega</small>`:""}</b></div>
    ${p.tipo==="entrega"?(p.taxa==null?`<button class="b-taxa" onclick="informarTaxa('${p.id}')">Informar taxa de entrega</button>`:`<div class="taxa-ok"><span>Produtos ${brl(p.total-p.taxa)} + entrega ${brl(p.taxa)}</span><button onclick="informarTaxa('${p.id}')">alterar</button></div>`):""}
    <div class="acoes">
      ${ANTERIOR[p.status]?`<button class="voltar" onclick="mudar('${p.id}','${ANTERIOR[p.status]}')">‹ voltar</button>`:""}
      <button class="avancar" onclick="mudar('${p.id}','${PROXIMO[p.status]}')">${TEXTO_BOTAO[p.status]}</button>
      ${p.status==="novo"?`<button class="cancelar" onclick="cancelar('${p.id}')">Cancelar</button>`:""}
    </div></div>`;
}

function desenhar(){
  const lista = pedidos.filter(p=>filtro==="todos"||p.tipo===filtro).sort((a,b)=>a.criado-b.criado);
  ["novo","preparando","pronto"].forEach(s=>{
    const doStatus = lista.filter(p=>p.status===s);
    $("n-"+s).textContent = doStatus.length;
    $("col-"+s).innerHTML = doStatus.length ? doStatus.map(cartao).join("") : `<p class="vazio">Nenhum pedido</p>`;
  });
  const ent = lista.filter(p=>p.status==="entregue"||p.status==="cancelado").sort((a,b)=>b.atualizado-a.atualizado);
  $("sum-entregue").textContent = `Entregues e cancelados (${ent.length})`;
  $("col-entregue").innerHTML = ent.map(p=>`<div class="linha-ent"><span><b>#${esc(p.id)}</b> · ${rotuloTipo(p)} · ${esc(p.cliente)} · ${brl(p.total)}${p.status==="cancelado"?" · <b style='color:#ff9a9a'>cancelado</b>":""}</span>
      <button onclick="mudar('${p.id}','pronto')">reabrir</button></div>`).join("");
  desenharContas();
  document.title = (lista.filter(p=>p.status==="novo").length ? `(${lista.filter(p=>p.status==="novo").length}) ` : "") + "Painel de Pedidos | Real Burger";
}

async function mudar(id, status){
  const p = pedidos.find(x=>x.id===id); if(!p) return;
  const antes = p.status; p.status = status; p.atualizado = Date.now(); pendentes.set(id, {status, quando: Date.now(), ate: Date.now()+45000}); novosPiscando.delete(id); desenhar();
  if(!SCRIPT_URL) return;
  try{ const r = await api({acao:"status", id, status}); if(!r.ok) throw 0; }
  catch(e){ pendentes.delete(id); (pedidos.find(x=>x.id===id)||p).status = antes; desenhar(); alert("Não consegui salvar. Confira a internet e tente de novo."); }
}
function cancelar(id){ if(confirm(`Cancelar o pedido #${id}?`)) mudar(id,"cancelado"); }

document.querySelectorAll("#filtros button").forEach(b=>b.onclick=()=>{
  filtro=b.dataset.f; document.querySelectorAll("#filtros button").forEach(x=>x.classList.toggle("sel",x===b)); desenhar();
});

function bipe(){
  if(!somLigado || !audio) return;
  [0,0.25,0.5].forEach(t=>{
    const o=audio.createOscillator(), g=audio.createGain();
    o.frequency.value = 880; o.type="sine"; o.connect(g); g.connect(audio.destination);
    g.gain.setValueAtTime(0.0001, audio.currentTime+t); g.gain.exponentialRampToValueAtTime(0.5, audio.currentTime+t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime+t+0.2);
    o.start(audio.currentTime+t); o.stop(audio.currentTime+t+0.22);
  });
}
function alternaSom(){ somLigado=!somLigado; guardar("rb_som", somLigado?"1":"0"); atualizaBotaoSom(); if(somLigado) bipe(); }
function atualizaBotaoSom(){ $("som").textContent = somLigado ? "🔔 Som ligado" : "🔕 Som desligado"; }
let piscaTimer=null;
function piscaTitulo(n){ /* o título já mostra a contagem; o cartão pisca na tela */ }
function relogio(){ $("relogio").textContent = new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}); }

/* ========= TAXA DE ENTREGA ========= */
let taxasPend = new Map();
function aplicaTaxas(lista){ const agora=Date.now(); lista.forEach(p=>{ const x=taxasPend.get(p.id); if(!x) return; if(Number(p.taxa)===x.taxa || agora>x.ate){ taxasPend.delete(p.id); } else { p.taxa=x.taxa; p.total=x.total; } }); }
async function informarTaxa(id){
  const p = pedidos.find(x=>x.id===id); if(!p) return;
  const produtos = Number(p.total||0) - Number(p.taxa||0);
  const r = prompt(`Taxa de entrega combinada com ${p.cliente||"o cliente"} (pedido #${id}).\nProdutos: ${brl(produtos)}\n\nDigite o valor da taxa, ex.: 6,00`, p.taxa!=null ? String(p.taxa).replace(".",",") : "");
  if(r===null) return;
  const taxa = Math.round(Number(String(r).replace(/[^\d,.]/g,"").replace(",","."))*100)/100;
  if(!(taxa>=0 && taxa<=200) || String(r).trim()===""){ alert("Valor inválido. Digite só o número, ex.: 6,00"); return; }
  const antes = {taxa:p.taxa, total:p.total};
  p.taxa = taxa; p.total = produtos + taxa; taxasPend.set(id,{taxa, total:p.total, ate:Date.now()+45000}); desenhar();
  try{ const res = await api({acao:"taxa", id, valor:String(taxa)}); if(!res.ok || res.taxa===undefined) throw 0; }
  catch(e){ taxasPend.delete(id); p.taxa=antes.taxa; p.total=antes.total; desenhar(); alert("Não consegui salvar a taxa. Confira a internet e tente de novo."); }
}

/* ========= CONTAS DAS MESAS ========= */
const QTD_MESAS = 5;
let vistaAtual = "fila", fechandoAte = new Map(), CARD = null, ADIC = [], lanc = {mesa:null, itens:[], aberto:null};

function vista(v){
  vistaAtual = v; $("vbFila").classList.toggle("sel", v==="fila"); $("vbContas").classList.toggle("sel", v==="contas");
  $("vFila").style.display = v==="fila" ? "" : "none"; $("detEntregue").style.display = v==="fila" ? "" : "none";
  $("filtros").style.display = v==="fila" ? "" : "none"; $("vContas").style.display = v==="contas" ? "block" : "none";
  desenharContas();
}
function contaFechada(p){ return !!p.conta || (fechandoAte.get(p.id)||0) > Date.now(); }
function contasAbertas(){
  const m = new Map();
  pedidos.filter(p=>p.tipo==="mesa" && p.status!=="cancelado" && !contaFechada(p)).sort((a,b)=>a.criado-b.criado)
    .forEach(p=>{ const k=String(p.mesa); if(!m.has(k)) m.set(k,[]); m.get(k).push(p); });
  return [...m.entries()].sort((a,b)=>Number(a[0])-Number(b[0]));
}
const ROT_ST = {novo:"na fila", preparando:"preparando", pronto:"pronto", entregue:"entregue"};
function desenharContas(){
  const abertas = contasAbertas();
  $("vbContas").textContent = `Contas abertas (${abertas.length})`;
  if(vistaAtual!=="contas") return;
  $("gradeContas").innerHTML = abertas.length ? abertas.map(([mesa,lista])=>{
    const total = lista.reduce((s,p)=>s+Number(p.total||0),0);
    const peds = lista.map(p=>`<div class="conta-ped"><div class="cab"><span>#${esc(p.id)} · ${hora(p.criado)}${p.cliente?` · ${esc(p.cliente)}`:""}${ehViagem(p)?` · <span class="viagem-p">para viagem</span>`:""}</span><span class="st">${ROT_ST[p.status]||""}</span></div>
      ${(p.itens||[]).map(i=>`<div><b>${i.qtd}x</b> ${esc(i.nome)}${i.adicionais&&i.adicionais.length?` <small style="color:var(--claro)">+ ${esc(i.adicionais.join(", "))}</small>`:""}</div>`).join("")}
      <div style="text-align:right;color:var(--claro);font-size:13px">${brl(p.total)}</div></div>`).join("");
    return `<div class="conta"><div class="conta-topo"><b>Mesa ${esc(mesa)}</b><span>aberta às ${hora(lista[0].criado)}</span></div>${peds}
      <div class="conta-total"><span>Total da conta</span><b>${brl(total)}</b></div>
      <div class="conta-acoes"><button class="b-add" onclick="abrirLancar(${Number(mesa)})">+ Adicionar item</button><button class="b-fechar" onclick="fecharConta('${esc(mesa)}')">Fechar conta</button></div></div>`;
  }).join("") : `<p class="vazio">Nenhuma mesa com conta aberta.</p>`;
  const fech = new Map();
  pedidos.filter(p=>p.tipo==="mesa" && p.status!=="cancelado" && p.conta).forEach(p=>{ const k=p.mesa+"|"+p.conta; if(!fech.has(k)) fech.set(k,{mesa:p.mesa, quando:p.conta.replace("fechada ","").slice(11,16), total:0}); fech.get(k).total+=Number(p.total||0); });
  const lf=[...fech.values()].reverse();
  $("sum-fechadas").textContent = `Contas fechadas (${lf.length})`;
  $("listaFechadas").innerHTML = lf.map(c=>`<div class="linha-conta"><span>Mesa ${esc(c.mesa)} · fechada às ${esc(c.quando)}</span><b>${brl(c.total)}</b></div>`).join("");
}
async function fecharConta(mesa){
  const lista = (contasAbertas().find(c=>c[0]===String(mesa))||[])[1]; if(!lista) return;
  const total = lista.reduce((s,p)=>s+Number(p.total||0),0);
  const faltam = lista.filter(p=>p.status!=="entregue").length;
  if(!confirm(`Fechar a conta da Mesa ${mesa}?\nTotal: ${brl(total)}${faltam?`\n\nAtenção: ${faltam} pedido(s) ainda não marcado(s) como entregue.`:""}`)) return;
  const ids = lista.map(p=>p.id), ate = Date.now()+45000;
  ids.forEach(id=>fechandoAte.set(id, ate)); desenharContas();
  try{
    const r = await api({acao:"fechar", mesa:String(mesa), ids:ids.join(",")});
    if(!r.ok || r.fechadas===undefined) throw new Error(r.erro||"script antigo");
  }catch(e){ ids.forEach(id=>fechandoAte.delete(id)); desenharContas(); alert("Não consegui fechar a conta. Confira a internet e tente de novo."); }
}

/* Lançar itens pelo painel */
async function carregarCardapio(){
  if(CARD) return;
  const html = await (await fetch("index.html",{cache:"no-store"})).text();
  const pega = nome => { const i = html.indexOf("const "+nome+" = "); if(i<0) throw 0; const ini = html.indexOf("[", i); let n=0, j=ini;
    for(; j<html.length; j++){ if(html[j]==="[") n++; else if(html[j]==="]" && --n===0) break; } return Function('"use strict";return ('+html.slice(ini,j+1)+')')(); };
  CARD = pega("CARDAPIO"); ADIC = pega("ADICIONAIS");
}
async function abrirLancar(mesa){
  lanc = {mesa, itens:[], aberto:null};
  $("lancMesas").innerHTML = Array.from({length:QTD_MESAS},(_,i)=>`<button data-m="${i+1}" onclick="escolheMesa(${i+1})">Mesa ${i+1}</button>`).join("") + `<button data-m="balcao" onclick="escolheMesa('balcao')">Balcão (para viagem)</button>`; $("lancNome").value="";
  escolheMesa(mesa); desenharLancamento(); $("mLancar").classList.add("aberto");
  try{ await carregarCardapio(); desenharCardapio(); }catch(e){ $("lancCardapio").innerHTML = `<p class="vazio">Não consegui carregar o cardápio. Confira a internet.</p>`; }
}
function escolheMesa(m){ lanc.mesa=m; document.querySelectorAll("#lancMesas button").forEach(b=>b.classList.toggle("sel", b.dataset.m===String(m))); $("lancTitulo").textContent = m==="balcao" ? "Pedido no balcão (para viagem)" : m ? `Lançar na Mesa ${m}` : "Escolha a mesa ou o balcão"; $("lancNomeBox").style.display = m==="balcao" ? "block" : "none"; desenharLancamento(); }
function fecharLancar(){ $("mLancar").classList.remove("aberto"); }
function desenharCardapio(){
  $("lancCardapio").innerHTML = CARD.map((c,ci)=>`<div class="cat-t">${esc(c.cat)}</div>`+c.itens.map((it,ii)=>{
    const k=ci+"-"+ii, lanche=c.cat==="Lanches";
    return `<div class="prod"><span>${esc(it.nome)}${it.desc&&!lanche?` <small>${esc(it.desc)}</small>`:""}<br><small>${brl(it.preco)}</small></span><button onclick="${lanche?`abreOpcoes('${k}')`:`addLanc('${k}')`}">+</button></div>
      ${lanc.aberto===k?`<div class="opc"><b>Adicionais</b><br>${ADIC.map((a,ai)=>`<label><input type="checkbox" value="${ai}"> ${esc(a.nome)} (+${brl(a.preco)})</label>`).join("")}
        <input type="text" id="opcObs" placeholder="Observação (ex.: sem cebola)"><button class="ok" onclick="addLanc('${k}',true)">Adicionar</button></div>`:""}`;
  }).join("")).join("");
}
function abreOpcoes(k){ lanc.aberto = lanc.aberto===k ? null : k; desenharCardapio(); }
function addLanc(k, comOpc){
  const [ci,ii]=k.split("-").map(Number), it=CARD[ci].itens[ii];
  let adicionais=[], obs="";
  if(comOpc){ adicionais=[...document.querySelectorAll(".opc input:checked")].map(x=>ADIC[x.value]); obs=($("opcObs").value||"").trim(); lanc.aberto=null; desenharCardapio(); }
  const unit = it.preco + adicionais.reduce((s,a)=>s+a.preco,0);
  const igual = lanc.itens.find(x=>x.nome===it.nome && !x.adicionais.length && !adicionais.length && !x.obs && !obs);
  if(igual) igual.qtd++; else lanc.itens.push({qtd:1, nome:it.nome, adicionais, obs, unit});
  desenharLancamento();
}
function tiraLanc(i){ lanc.itens[i].qtd--; if(lanc.itens[i].qtd<1) lanc.itens.splice(i,1); desenharLancamento(); }
function desenharLancamento(){
  $("lancLista").innerHTML = lanc.itens.map((x,i)=>`<div class="lanc-it"><span><b>${x.qtd}x</b> ${esc(x.nome)}${x.adicionais.length?` + ${esc(x.adicionais.map(a=>a.nome).join(", "))}`:""}${x.obs?` (${esc(x.obs)})`:""}</span><span>${brl(x.unit*x.qtd)} <button onclick="tiraLanc(${i})">remover</button></span></div>`).join("");
  $("lancTotal").textContent = brl(lanc.itens.reduce((s,x)=>s+x.unit*x.qtd,0));
  $("lancEnviar").disabled = !lanc.mesa || !lanc.itens.length;
  $("lancEnviar").textContent = !lanc.mesa ? "Escolha a mesa ou o balcão" : "Enviar para a cozinha";
}
async function enviarLancamento(){
  if(!lanc.mesa || !lanc.itens.length) return;
  const balcao = lanc.mesa==="balcao";
  const ped = { id:String(Math.floor(100+Math.random()*900)), tipo: balcao?"retirada":"mesa", mesa: balcao?"":lanc.mesa,
    cliente: balcao ? (($("lancNome").value||"").trim() || "Balcão") : "Lançado pelo atendente", endereco: balcao ? "PARA VIAGEM" : "",
    itens: lanc.itens.map(x=>({qtd:x.qtd, nome:x.nome, adicionais:x.adicionais.map(a=>a.nome), obs:x.obs})),
    total: lanc.itens.reduce((s,x)=>s+x.unit*x.qtd,0), pagamento:"" };
  const b=$("lancEnviar"); b.disabled=true; b.textContent="Enviando...";
  try{
    await fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(ped)});
    fecharLancar(); setTimeout(buscar, 800);
  }catch(e){ alert("Não consegui enviar. Confira a internet e tente de novo."); desenharLancamento(); }
}

$("pin").addEventListener("keydown", e=>{ if(e.key==="Enter") entrar(); });
